<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TEND Notes — Development demo</title><style>:root{color-scheme:dark;--color-base-100:#151b19;--color-base-200:#1d2622;--color-base-content:#d8e3df;--color-primary:#66b798;--color-primary-content:#071a13;--color-error:#dc7777;--color-error-content:#250c0c}body{margin:0;background:var(--color-base-200);color:var(--color-base-content);font-family:system-ui}#demo-label{height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.5px;color:var(--color-base-content);opacity:.7}#app{height:calc(100dvh - 30px);max-width:1440px;margin:auto;box-shadow:0 0 50px #11221a08}#demo-theme{position:absolute;right:12px;top:5px;background:none;border:0;color:inherit;font:10px system-ui;cursor:pointer}</style></head><body><div id="demo-label">TEND Notes · Development demo · Sample notebook <button id="demo-theme" type="button">Preview light theme</button></div><div id="app"></div><script type="module" src="/src/demo.ts"></script><script>document.querySelector('#demo-theme').onclick=function(){const root=document.documentElement;const light=root.style.colorScheme!=='light';root.style.colorScheme=light?'light':'dark';const tokens=light?['#fafbf8','#f1f4ef','#263e38','#0f766e','#ffffff']:['#151b19','#1d2622','#d8e3df','#66b798','#071a13'];['base-100','base-200','base-content','primary','primary-content'].forEach((name,i)=>root.style.setProperty('--color-'+name,tokens[i]));this.textContent=light?'Preview dark theme':'Preview light theme';};</script></body></html>
